<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CERP UPLB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Background image */
        #bg {
            position: fixed;
            inset: 0;
            background-image: url('/static/images/CHE.png');
            background-size: cover;
            background-position: center;
            filter: blur(4px) brightness(0.6);
            transform: scale(1.05);
            z-index: 0;
        }

        /* Login card */
        #login-card {
            position: fixed;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            z-index: 10;
            width: 380px;
        }

        /* Ripple overlay — white circle expanding from card center */
        #ripple {
            position: fixed;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
            opacity: 0;
        }

        #ripple.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

<body>

    <div id="bg"></div>
    <div id="ripple"></div>

    <div id="login-card" class="bg-white rounded-2xl shadow-2xl p-10">
        <div class="flex justify-center mb-6">
            <img src="/static/images/uplogo.png" alt="UP Logo" class="w-16 h-16 object-contain">
        </div>

        <div class="mb-8 text-center">
            <h2 class="text-2xl font-bold text-gray-900 mb-1" style="font-family: 'Arsenal', sans-serif;">Sign In</h2>
            <p class="text-sm text-gray-500">CERP-UP UPLB</p>
        </div>

        <div id="error-msg"
            class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>

        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email or Username</label>
                <input type="text" id="email" name="email"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none transition"
                    placeholder="you@up.edu.ph or admin" required onfocus="this.style.boxShadow='0 0 0 2px #014421'"
                    onblur="this.style.boxShadow=''">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password"
                    class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none transition"
                    placeholder="••••••••" required onfocus="this.style.boxShadow='0 0 0 2px #014421'"
                    onblur="this.style.boxShadow=''">
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300" style="accent-color:#014421;">
                    <span class="text-sm text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-sm font-medium" style="color:#014421;">Forgot password?</a>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-3 rounded-lg text-white font-semibold text-sm tracking-wide transition duration-200 shadow-md hover:shadow-lg"
                style="background:#014421;" onmouseover="this.style.background='#013318'"
                onmouseout="this.style.background='#014421'">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">
                No account? <a href="#" class="font-semibold" style="color:#014421;">Contact Admin</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="/"
                class="text-xs text-gray-400 hover:text-gray-600 flex items-center justify-center gap-1 transition">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "{{ firebase_config.apiKey }}",
            authDomain: "{{ firebase_config.authDomain }}",
            projectId: "{{ firebase_config.projectId }}",
            storageBucket: "{{ firebase_config.storageBucket }}",
            messagingSenderId: "{{ firebase_config.messagingSenderId }}",
            appId: "{{ firebase_config.appId }}"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);

        function triggerRippleAndRedirect(redirectUrl) {
            const card = document.getElementById('login-card');
            const ripple = document.getElementById('ripple');
            const rect = card.getBoundingClientRect();

            // Center of the card
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            // Size large enough to cover the whole screen from that point
            const maxDist = Math.hypot(
                Math.max(cx, window.innerWidth - cx),
                Math.max(cy, window.innerHeight - cy)
            );
            const size = maxDist * 2 + 100;

            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            ripple.style.left = cx + 'px';
            ripple.style.top = cy + 'px';
            ripple.style.transition = `transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease`;
            ripple.classList.add('active');

            setTimeout(() => { window.location.href = redirectUrl; }, 1100);
        }

        window.handleLogin = async function (e) {
            e.preventDefault();

            const input = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const errBox = document.getElementById('error-msg');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                // Check if it's admin login (username without @)
                if (input === 'admin') {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: input, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        triggerRippleAndRedirect(data.redirect || '/dashboard/');
                        return;
                    }
                    throw new Error(data.error || 'Invalid credentials.');
                }

                // Otherwise, use Firebase authentication
                const userCredential = await signInWithEmailAndPassword(auth, input, password);
                const idToken = await userCredential.user.getIdToken();

                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const data = await res.json();
                if (res.ok) { triggerRippleAndRedirect(data.redirect || '/dashboard/'); return; }
                throw new Error(data.error || 'Session creation failed.');

            } catch (err) {
                const messages = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/invalid-email': 'Invalid email address.',
                    'auth/invalid-credential': 'Invalid email or password.',
                    'auth/too-many-requests': 'Too many attempts. Try again later.',
                };
                errBox.textContent = messages[err.code] || err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        };
    </script>

</body>

</html>

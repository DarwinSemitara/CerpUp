<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/forgot_password.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #fff;
        }

        .login-shell {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .login-brand {
            position: relative;
            flex: 0 0 60%;
            width: 60%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('/static/images/CHE.png');
            background-size: cover;
            background-position: center;
            filter: blur(4px) brightness(0.55);
            transform: scale(1.08);
        }

        .login-brand::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(1, 34, 15, 0.35) 0%, rgba(1, 68, 33, 0.45) 100%);
        }

        .login-brand-content {
            position: relative;
            z-index: 1;
            text-align: left;
            color: #fff;
            padding: 72px 80px;
            max-width: 760px;
            width: 100%;
        }

        .login-motto {
            font-family: 'Arsenal', sans-serif;
            font-size: clamp(2.6rem, 4.8vw, 4.4rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: 0.01em;
            margin: 0;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
        }

        .login-motto-line {
            display: block;
        }

        .login-motto-word {
            color: #E6B800;
            white-space: nowrap;
        }

        .login-motto-cursor {
            display: inline-block;
            width: 3px;
            height: 0.78em;
            margin-left: 4px;
            background: #fff;
            vertical-align: -0.08em;
            animation: motto-caret 0.85s step-end infinite;
        }

        @keyframes motto-caret {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-motto-cursor {
                animation: none;
                opacity: 1;
            }
        }

        #login-card {
            flex: 0 0 40%;
            width: 40%;
            background: #f4f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 40px;
            z-index: 10;
            overflow-y: auto;
        }

        .login-form-wrap {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12), 0 2px 8px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(15, 23, 42, 0.06);
            transform: translateY(-6px);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .password-toggle .icon-hide {
            display: none;
        }

        .password-toggle.is-visible .icon-show {
            display: none;
        }

        .password-toggle.is-visible .icon-hide {
            display: block;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 16px;
            color: #9ca3af;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .google-btn:hover {
            background: #f9fafb;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        #ripple {
            position: fixed;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
            opacity: 0;
        }

        #ripple.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .login-brand {
                display: none;
            }

            .login-shell {
                height: 100%;
            }

            #login-card {
                flex: 1 1 100%;
                width: 100%;
                min-height: 100%;
                padding: 28px 20px;
                align-items: center;
            }

            .login-form-wrap {
                padding: 28px 22px 22px;
                transform: none;
                box-shadow: 0 12px 36px rgba(15, 23, 42, 0.1), 0 1px 4px rgba(15, 23, 42, 0.05);
            }
        }

        @media (max-width: 479px) {
            #login-card {
                padding: 20px 14px;
            }

            .login-form-wrap {
                padding: 24px 18px 20px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <div id="ripple"></div>

    <div class="login-shell">
        <aside class="login-brand">
            <div class="login-brand-content">
                <h1 class="login-motto">
                    <span class="login-motto-line">One place for DCERP to</span>
                    <span class="login-motto-line">
                        <span id="motto-word" class="login-motto-word">schedule classes</span><span
                            class="login-motto-cursor" aria-hidden="true"></span>
                    </span>
                </h1>
            </div>
        </aside>

        <main id="login-card">
            <div class="login-form-wrap">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-1" style="font-family: 'Arsenal', sans-serif;">
                        Welcome back</h2>
                    <p class="text-sm text-gray-500">Sign in to CerpUp</p>
                </div>

                <div id="error-msg"
                    class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>

                <form id="login-form" class="space-y-5" onsubmit="return handleLogin(event)">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                        <input type="text" id="email" autocomplete="username"
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none transition"
                            placeholder="you@up.edu.ph" required onfocus="this.style.boxShadow='0 0 0 2px #014421'"
                            onblur="this.style.boxShadow=''">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" autocomplete="current-password"
                                class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none transition"
                                placeholder="••••••••" required onfocus="this.style.boxShadow='0 0 0 2px #014421'"
                                onblur="this.style.boxShadow=''">
                            <button type="button" class="password-toggle" id="toggle-password"
                                aria-label="Show password" onclick="togglePasswordVisibility()">
                                <svg class="icon-show" width="18" height="18" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="1.8">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-hide" width="18" height="18" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="1.8">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3 3l18 18M10.5 10.7a3 3 0 004.1 4.1M9.9 5.5A10.7 10.7 0 0112 5.25C18 5.25 21.75 12 21.75 12a18.4 18.4 0 01-4.2 4.7M6.4 6.6A18.5 18.5 0 002.25 12S6 18.75 12 18.75c1.4 0 2.7-.3 3.9-.8" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 rounded border-gray-300"
                                style="accent-color:#014421;">
                            <span class="text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" onclick="showForgotPasswordModal(); return false;" class="text-sm font-medium"
                            style="color:#014421;">Forgot password?</a>
                    </div>

                    <button type="submit" id="submit-btn"
                        class="w-full py-3 rounded-lg text-white font-semibold text-sm tracking-wide transition duration-200 shadow-md hover:shadow-lg"
                        style="background:#014421;" onmouseover="this.style.background='#013318'"
                        onmouseout="this.style.background='#014421'">
                        Sign In
                    </button>
                </form>

                <div class="login-divider">or</div>
                <button type="button" class="google-btn" id="google-signin-btn">
                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#FFC107"
                            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z" />
                        <path fill="#FF3D00"
                            d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z" />
                        <path fill="#4CAF50"
                            d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z" />
                        <path fill="#1976D2"
                            d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.6 7.5l6.3 5.3C37.8 38.4 44 33.5 44 24c0-1.3-.1-2.3-.4-3.5z" />
                    </svg>
                    Continue with Google
                </button>

                <div class="mt-5">
                    <a href="/"
                        class="text-xs text-gray-400 hover:text-gray-600 inline-flex items-center gap-1 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Back to Home
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        function togglePasswordVisibility() {
            var input = document.getElementById('password');
            var btn = document.getElementById('toggle-password');
            if (!input || !btn) return;
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.classList.toggle('is-visible', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        }

        (function runMottoTypewriter() {
            var el = document.getElementById('motto-word');
            if (!el) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            var words = ['schedule classes', 'assign faculty', 'track research', 'generate reports'];
            var index = 0;
            var text = words[0];
            var deleting = false;

            function tick() {
                var full = words[index];
                if (!deleting) {
                    text = full.slice(0, text.length + 1);
                    el.textContent = text;
                    if (text === full) {
                        deleting = true;
                        setTimeout(tick, 1600);
                        return;
                    }
                    setTimeout(tick, 72);
                    return;
                }
                text = full.slice(0, Math.max(0, text.length - 1));
                el.textContent = text;
                if (!text) {
                    deleting = false;
                    index = (index + 1) % words.length;
                    setTimeout(tick, 320);
                    return;
                }
                setTimeout(tick, 42);
            }

            setTimeout(tick, 900);
        })();
    </script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Forgot Password -->
    <script src="/static/js/forgot_password.js"></script>

    <!-- AGGRESSIVE: Disable back button immediately -->
    <script>
        // This runs IMMEDIATELY - no async delays
        (function () {
            'use strict';

            // Method 1: Continuously push state to prevent back navigation
            function disableBackButton() {
                window.history.pushState(null, '', window.location.href);
            }

            // Push state immediately
            disableBackButton();

            // Override popstate to prevent any back navigation
            window.addEventListener('popstate', function (event) {
                disableBackButton();
            });

            // Method 2: Clear browser cache and storage immediately
            if ('caches' in window) {
                caches.keys().then(function (names) {
                    names.forEach(function (name) {
                        caches.delete(name);
                    });
                });
            }

            // Clear all storage
            try {
                sessionStorage.clear();
                localStorage.clear();
            } catch (e) { }

            // Method 3: Check session ONCE on load - only redirect if logged in
            fetch('/api/current-member', {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            }).then(function (res) {
                if (res.ok) {
                    // Already logged in - redirect immediately without animation
                    console.log('User already logged in, redirecting to dashboard');
                    window.location.replace('/dashboard/');
                }
                // If not ok (401, 404, etc.), do nothing - show login page
            }).catch(function (err) {
                // Network error or not authenticated - do nothing, show login page
                console.log('Not logged in, showing login page');
            });

            // Method 4: Block back navigation during page lifecycle
            window.addEventListener('pagehide', disableBackButton);
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    // Page restored from cache, disable back
                    disableBackButton();
                }
            });
        })();
    </script>

    <script>
        // Initialize Supabase (only once)
        (function () {
            'use strict';

            const SUPABASE_URL = '{{ supabase_url }}';
            const SUPABASE_ANON_KEY = '{{ supabase_anon_key }}';
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            function triggerRippleAndRedirect(redirectUrl) {
                const card = document.getElementById('login-card');
                const ripple = document.getElementById('ripple');
                const rect = card.getBoundingClientRect();

                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                const maxDist = Math.hypot(
                    Math.max(cx, window.innerWidth - cx),
                    Math.max(cy, window.innerHeight - cy)
                );
                const size = maxDist * 2 + 100;

                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = cx + 'px';
                ripple.style.top = cy + 'px';
                ripple.style.transition = `transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease`;
                ripple.classList.add('active');

                // Use replace instead of href to prevent back button
                setTimeout(() => {
                    window.location.replace(redirectUrl);
                    // Prevent back button after redirect
                    window.history.pushState(null, '', redirectUrl);
                    window.onpopstate = function () {
                        window.history.go(1);
                    };
                }, 1100);
            }

            window.handleLogin = async function (e) {
                e.preventDefault();
                e.stopPropagation();

                const input = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submit-btn');
                const errBox = document.getElementById('error-msg');

                errBox.classList.add('hidden');
                btn.disabled = true;
                btn.textContent = 'Signing in...';

                try {
                    // Check if it's admin login (username without @)
                    if (input === 'cerp_admin' || input === 'admin') {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: input, password })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            triggerRippleAndRedirect(data.redirect || '/dashboard/');
                            return;
                        }
                        throw new Error(data.error || 'Invalid credentials.');
                    }

                    // Otherwise, use Supabase authentication
                    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                        email: input,
                        password: password
                    });

                    if (authError) throw authError;

                    // Get the access token
                    const accessToken = authData.session.access_token;

                    // Send token to backend
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ accessToken })
                    });

                    const data = await res.json();
                    if (res.ok) {
                        triggerRippleAndRedirect(data.redirect || '/dashboard/');
                        return false;
                    }
                    throw new Error(data.error || 'Session creation failed.');

                } catch (err) {
                    console.error('Login error:', err);
                    const messages = {
                        'Invalid login credentials': 'Invalid email or password.',
                        'Invalid email or password': 'Invalid email or password.',
                        'User not found': 'No account found with this email.',
                        'Wrong password': 'Incorrect password.',
                    };
                    errBox.textContent = messages[err.message] || err.message || 'Login failed. Please try again.';
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }

                return false; // Prevent form submission
            };
        })();
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CERP Member Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member_dashboard.css') }}">
</head>

<body>
    <div id="shell">
        <!-- Sidebar -->
        <div id="sidebar">
            <div style="padding:20px 18px;border-bottom:1px solid rgba(255,255,255,0.1);">
                <div style="font-size:1.25rem;font-weight:700;color:white;">CERP</div>
                <div style="font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:2px;">Member Portal</div>
            </div>

            <div style="flex:1;overflow-y:auto;padding:12px 0;">
                <a href="/user/dashboard/" class="nav-link">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
                    </svg>
                    Dashboard
                </a>

                <button class="nav-link" id="research-nav-btn" onclick="toggleSub('research-sub','research-chev','research-nav-btn')">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Research
                    <svg id="research-chev" class="chevron" width="13" height="13" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div id="research-sub" class="sub-nav">
                    <a href="#" class="sub-link">My Research</a>
                    <a href="#" class="sub-link">Add New</a>
                </div>

                <button class="nav-link" id="extensions-nav-btn" onclick="toggleSub('extensions-sub','extensions-chev','extensions-nav-btn')">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    Extensions
                    <svg id="extensions-chev" class="chevron" width="13" height="13" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div id="extensions-sub" class="sub-nav">
                    <a href="#" class="sub-link">My Extensions</a>
                    <a href="#" class="sub-link">Add New</a>
                </div>

                <a href="/user/admin/" class="nav-link active">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Admin
                </a>

                <a href="#" class="nav-link" onclick="event.preventDefault(); showSettings();">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Settings
                </a>
            </div>

            <div style="padding:10px 10px 18px;border-top:1px solid rgba(255,255,255,0.1);flex-shrink:0;">
                <button onclick="document.getElementById('logout-modal').classList.add('open')" class="nav-link"
                    style="color:#f87171;">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </button>
            </div>
        </div>

        <!-- Right Column -->
        <div id="right-col">
            <div id="top-header">
                <div style="font-size:1.1rem;font-weight:600;color:#374151;" id="header-title">Admin</div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="text-align:right;margin-right:4px;" id="user-display-name">
                        <div style="font-size:0.85rem;font-weight:600;color:#1f2937;">{{ email }}</div>
                    </div>
                    <div class="profile-photo-placeholder">{{ initial }}</div>
                </div>
            </div>

            <div id="page-content">
                <div class="welcome-section">
                    <svg width="80" height="80" fill="none" viewBox="0 0 24 24" stroke="#d1d5db" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <div style="font-size:1.8rem;font-weight:700;color:#111827;">Admin Page</div>
                    <div style="font-size:1rem;color:#6b7280;max-width:500px;text-align:center;margin-top:8px;">
                        This page is under construction. Admin features will be added here soon.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logout Modal -->
    <div id="logout-modal">
        <div class="modal-box">
            <h2 style="font-size:1.1rem;font-weight:700;color:#111827;margin:0 0 8px;">Sign out?</h2>
            <p style="font-size:.875rem;color:#6b7280;margin:0 0 24px;">You'll be redirected to the login page.</p>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button onclick="document.getElementById('logout-modal').classList.remove('open')"
                    class="logout-cancel-btn">Cancel</button>
                <button onclick="doLogout()" class="logout-confirm-btn">Yes, sign out</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSub(subId, chevId, btnId) {
            const sub = document.getElementById(subId);
            const chev = document.getElementById(chevId);
            const btn = document.getElementById(btnId);
            const open = sub.classList.toggle('open');
            chev.classList.toggle('open', open);
            btn.classList.toggle('active', open);
        }

        async function doLogout() {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                const data = await response.json();

                sessionStorage.clear();
                localStorage.clear();

                window.location.replace(data.redirect || '/login');

                window.history.pushState(null, '', window.location.href);
                window.onpopstate = function () {
                    window.location.replace('/login');
                };
            } catch (err) {
                console.error('Logout error:', err);
                sessionStorage.clear();
                localStorage.clear();
                window.location.replace('/login');
            }
        }

        document.getElementById('logout-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('logout-modal'))
                document.getElementById('logout-modal').classList.remove('open');
        });

        function showSettings() {
            window.location.href = '/user/dashboard/';
            // Once on dashboard, user can navigate to settings tab
        }
    </script>
</body>

</html>

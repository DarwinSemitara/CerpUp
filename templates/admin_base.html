<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - {{ page_title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar -->

                <div class="sidebar-subtitle">Admin Dashboard</div>
            </div>

            <nav class="sidebar-nav">

                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"

                    </svg>
                    Dashboard
                </a>

                <a href="/research/" class="nav-item {% if active_page == 'research' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Research
                </a>

                <a href="/extensions/" class="nav-item {% if active_page == 'extensions' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                    Extensions
                </a>

                <a href="/admin-page/" class="nav-item {% if active_page == 'admin' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Admin
                </a>

                <a href="/schedule/class/" class="nav-item {% if active_page == 'schedule' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    Class Schedule
                </a>

                <a href="/schedule/courses/" class="nav-item {% if active_page == 'courses' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    Courses
                </a>

                <a href="/schedule/events/" class="nav-item {% if active_page == 'events' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                    </svg>
                    News & Events
                </a>

                <a href="/fsr/" class="nav-item {% if active_page == 'fsr' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7c0-2 1-3 3-3h10c2 0 3 1 3 3M4 7h16M10 11v4M14 11v4" />
                    </svg>
                    FSR
                </a>

                <a href="/manage/" class="nav-item {% if active_page == 'manage' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    Manage
                </a>

            <div class="sidebar-footer">
                <button class="nav-item" onclick="openLogoutModal()" style="color: white;">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main">
            <header id="header">
                <div class="page-title" id="page-title">{{ page_title }}</div>
                <div class="user-info">
                    <!-- Notification Bell -->
                    <button class="notification-bell" onclick="toggleNotifications()" id="notification-bell">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span class="notification-badge" id="notification-badge" style="display:none;">0</span>
                    </button>

                    <!-- Notification Dropdown -->
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>Activity Log</h3>
                            <button class="mark-all-read" onclick="markAllAsRead()">Mark all as read</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div class="notification-loading">
                                <div class="content-spinner"></div>
                                <div style="margin-top:8px;font-size:0.85rem;">Loading...</div>
                            </div>
                        </div>
                    </div>

                    <div class="user-email">{{ email }}</div>
                    <div class="user-avatar-logo">
                        <img src="/static/images/uplogo.png" alt="UPLB"
                            style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                </div>
            </header>

            <div id="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Logout Modal - Universal Design -->
    <div id="logout-modal">
        <div class="modal-box">
            <h2 style="font-size:1.1rem;font-weight:700;color:#111827;margin:0 0 8px;">Sign out?</h2>
            <p style="font-size:.875rem;color:#6b7280;margin:0 0 24px;">You'll be redirected to the login page.</p>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button onclick="closeLogoutModal()" class="logout-cancel-btn">Cancel</button>
                <button onclick="confirmLogout()" class="logout-confirm-btn">Yes, sign out</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>

    <!-- AGGRESSIVE: Completely disable back button navigation -->
    <script>
        (function () {
            'use strict';

            // Method 1: Continuously push state to trap user in current page
            function disableBackButton() {
                window.history.pushState(null, '', window.location.href);
            }

            // Execute immediately on load
            disableBackButton();

            // Block ALL popstate events
            window.addEventListener('popstate', function (event) {
                event.preventDefault();
                event.stopImmediatePropagation();
                disableBackButton();
                return false;
            }, true);

            // Method 2: Disable browser back/forward on load
            window.onload = function () {
                disableBackButton();

                // Continuously push state to prevent back
                setInterval(disableBackButton, 100);
            };

            // Method 3: Check session validity aggressively
            function validateSession() {
                fetch('/api/current-member', {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                }).then(function (res) {
                    if (!res.ok) {
                        // Session invalid - force redirect to login
                        sessionStorage.clear();
                        localStorage.clear();
                        window.location.replace('/login');
                    }
                }).catch(function () {
                    // Network error or not authenticated
                    window.location.replace('/login');
                });
            }

            // Check session on page visibility changes
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) {
                    validateSession();
                }
            });

            // Check session on page show (when coming from cache)
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    validateSession();
                }
                disableBackButton();
            });

            // Prevent page from being cached
            window.addEventListener('pagehide', function () {
                disableBackButton();
            });

            // Method 4: Override browser navigation
            if (window.history && window.history.pushState) {
                var originalPushState = window.history.pushState;
                window.history.pushState = function () {
                    originalPushState.apply(this, [null, '', window.location.href]);
                };
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>

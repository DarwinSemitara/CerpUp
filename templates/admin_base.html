<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERP Admin - {{ page_title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CERP</div>
                <div class="sidebar-subtitle">Admin Dashboard</div>
            </div>

            <nav class="sidebar-nav">
                <a href="/dashboard/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
                    </svg>
                    Dashboard
                </a>

                <a href="/research/" class="nav-item {% if active_page == 'research' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Research
                </a>

                <a href="/extensions/" class="nav-item {% if active_page == 'extensions' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                    Extensions
                </a>

                <button class="nav-item" onclick="toggleSubNav('schedule-sub', this)">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    Schedule
                    <svg class="nav-chevron" width="13" height="13" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="sub-nav" id="schedule-sub">
                    <a href="/schedule/class/" class="sub-nav-item {% if active_page == 'schedule' %}active{% endif %}">
                        Class Schedule
                    </a>
                    <a href="/schedule/section/"
                        class="sub-nav-item {% if active_page == 'section' %}active{% endif %}">
                        Section
                    </a>
                    <a href="/schedule/events/" class="sub-nav-item">News and Events</a>
                </div>

                <a href="/fsr/" class="nav-item {% if active_page == 'fsr' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7c0-2 1-3 3-3h10c2 0 3 1 3 3M4 7h16M10 11v4M14 11v4" />
                    </svg>
                    FSR
                </a>

                <a href="/manage/" class="nav-item {% if active_page == 'manage' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    Manage
                </a>

                <a href="/che/" class="nav-item {% if active_page == 'che' %}active{% endif %}">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                    CHE Assistant
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item" onclick="openLogoutModal()" style="color: white;">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main">
            <header id="header">
                <div class="page-title" id="page-title">{{ page_title }}</div>
                <div class="user-info">
                    <div class="user-email">{{ email }}</div>
                    <div class="user-avatar">{{ initial }}</div>
                </div>
            </header>

            <div id="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Logout Modal - Universal Design -->
    <div id="logout-modal">
        <div class="modal-box">
            <h2 style="font-size:1.1rem;font-weight:700;color:#111827;margin:0 0 8px;">Sign out?</h2>
            <p style="font-size:.875rem;color:#6b7280;margin:0 0 24px;">You'll be redirected to the login page.</p>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button onclick="closeLogoutModal()" class="logout-cancel-btn">Cancel</button>
                <button onclick="confirmLogout()" class="logout-confirm-btn">Yes, sign out</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>

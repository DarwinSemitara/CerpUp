        function changeSidebarColor(colorName, colorValue) {
            settings.sidebarColor = colorName;
            localStorage.setItem('sidebarColor', colorName);
            applySidebarColor(colorName);

            // Update active state in UI
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
            event.target.classList.add('active');
        }

        function applySidebarColor(colorName) {
            const colors = {
                forest: '#014421',
                maroon: '#6b0f1a',
                navy: '#1e3a8a',
                dark: '#1a1a1a',
                teal: '#0f766e',
                slate: '#334155'
            };

            const colorValue = colors[colorName] || colors.forest;
            const sidebar = document.getElementById('sidebar');
            sidebar.style.background = colorValue;

            // Set CSS variable for buttons to use
            document.documentElement.style.setProperty('--sidebar-color', colorValue);
        }

        function toggleTheme() {
            settings.theme = settings.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', settings.theme);
            applyTheme(settings.theme);

            // Update toggle in UI
            const toggle = event.target;
            toggle.classList.toggle('active');
        }

        function applyTheme(theme) {
            const content = document.getElementById('page-content');
            const header = document.getElementById('top-header');
            const userName = document.getElementById('user-display-name');

            if (theme === 'dark') {
                content.style.background = '#1f2937';
                header.style.background = '#111827';
                header.style.borderColor = '#374151';
                document.getElementById('header-title').style.color = '#f3f4f6';
                if (userName) userName.style.color = '#f3f4f6';
            } else {
                content.style.background = '#f3f4f6';
                header.style.background = 'white';
                header.style.borderColor = '#e5e7eb';
                document.getElementById('header-title').style.color = '#374151';
                if (userName) userName.style.color = '#1f2937';
            }
        }

        // ── Chart.js Initialization ──────────────────────────────────────

        let userPubChart = null;

        function initUserCharts() {
            // Destroy existing charts if they exist

                userPubChart.destroy();
                userPubChart = null;
            }
            if (userTapChart) {
                userTapChart.destroy();
                userTapChart = null;
            }

            const thisYearData = [5, 7, 4, 8, 6, 9, 7, 10, 5, 8, 6, 9];
            const lastYearData = [4, 6, 3, 7, 5, 8, 6, 9, 4, 7, 5, 8];

            // ── Publications Line Chart ──

            if (pubCtx) {
                userPubChart = new Chart(pubCtx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'This Year',

                                borderColor: '#fb923c',
                                backgroundColor: 'transparent',
                                borderWidth: 2.5,
                                pointBackgroundColor: '#fff',
                                pointBorderColor: '#fb923c',
                                pointBorderWidth: 2.5,
                                pointRadius: 6,
                                pointHoverRadius: 8,
                                pointHoverBorderWidth: 3,
                                pointHoverBackgroundColor: '#fff',
                                pointHoverBorderColor: '#fb923c',
                                fill: false,
                                tension: 0.4,
                            },
                            {
                                label: 'Last Year',
                                data: lastYearData,
                                borderColor: '#d1d5db',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                borderDash: [8, 4],
                                pointBackgroundColor: '#fff',
                                pointBorderColor: '#d1d5db',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 7,
                                pointHoverBorderWidth: 2.5,
                                pointHoverBackgroundColor: '#fff',
                                pointHoverBorderColor: '#d1d5db',
                                fill: false,
                                tension: 0.4,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.85)',
                                padding: 12,
                                cornerRadius: 8,
                                titleFont: { size: 13, weight: '600' },
                                bodyFont: { size: 12 },
                                displayColors: true,
                                boxWidth: 8,
                                boxHeight: 8,
                                boxPadding: 6,
                                callbacks: {
                                    title: items => months[items[0].dataIndex],
                                    label: ctx => ` ${ctx.dataset.label}: ${ctx.raw} publications`
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: '#f3f4f6',
                                    drawBorder: false,
                                },
                                ticks: {
                                    font: { size: 11, weight: '500' },
                                    stepSize: 2,
                                    padding: 10,
                                    color: '#6b7280'
                                },
                                border: { display: false }
                            },
                            x: {
                                grid: { display: false },
                                ticks: {
                                    font: { size: 11, weight: '500' },
                                    padding: 8,
                                    color: '#6b7280'
                                },
                                border: { display: false }
                            }
                        }
                    }
                });
            }

            // ── TAP-HSP Pie Chart ──
            const tapCtx = document.getElementById('user-tap-chart');
            if (tapCtx) {
                const tapData = [18, 12, 6]; // [ongoing, finished, pending]

                userTapChart = new Chart(tapCtx, {
                    type: 'pie',
                    data: {
                        labels: ['Ongoing', 'Finished', 'Pending'],
                        datasets: [{
                            data: tapData,
                            backgroundColor: ['#fb923c', '#fbbf24', '#fde047'],
                            borderColor: ['#fff', '#fff', '#fff'],
                            borderWidth: 2,
                            hoverOffset: 0,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.85)',
                                padding: 12,
                                cornerRadius: 8,
                                titleFont: { size: 13, weight: '600' },
                                bodyFont: { size: 12 },
                                callbacks: {
                                    label: ctx => {
                                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                        const pct = ((ctx.raw / total) * 100).toFixed(1);
                                        return ` ${ctx.label}: ${ctx.raw} (${pct}%)`;
                                    }
                                }
                            }
                        },
                        onHover: (event, activeElements) => {
                            if (activeElements.length > 0) {
                                const index = activeElements[0].index;
                                const meta = userTapChart.getDatasetMeta(0);

                                // Dim all segments except the hovered one
                                meta.data.forEach((segment, i) => {
                                    if (i === index) {
                                        segment.options.backgroundColor = ['#fb923c', '#fbbf24', '#fde047'][i];
                                    } else {
                                        segment.options.backgroundColor = ['rgba(251, 146, 60, 0.3)', 'rgba(251, 191, 36, 0.3)', 'rgba(253, 224, 71, 0.3)'][i];
                                    }
                                });
                                userTapChart.update('none');
                            } else {
                                // Reset all segments to original colors
                                const meta = userTapChart.getDatasetMeta(0);
                                meta.data.forEach((segment, i) => {
                                    segment.options.backgroundColor = ['#fb923c', '#fbbf24', '#fde047'][i];
                                });
                                userTapChart.update('none');
                            }
                        }
                    }
                });
            }
        }

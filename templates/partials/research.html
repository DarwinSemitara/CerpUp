        <option value="">Faculty name</option>
        <option value="faculty">Faculty name</option>
        <option value="cat">Category</option>
        <option value="start">Date</option>
      </select>
    </div>

    <!-- Search Bar -->
    <div style="position:relative;width:280px;">
      <input type="text" id="res-search" placeholder="Search" oninput="resTable.apply()"

          <path stroke-linecap="round" d="M21 21l-4.35-4.35" />
        </svg>
      </button>
    </div>

  </div>

    <div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:8px;background:white;">
      <table style="width:100%;border-collapse:collapse;">

          <tr style="background:#f9fafb;border-bottom:2px solid #e5e7eb;">
            <th
              style="padding:12px;text-align:left;font-size:0.8rem;font-weight:600;color:#374151;white-space:nowrap;border-right:1px solid #e5e7eb;">
              Faculty</th>
            <th
              style="padding:12px;text-align:left;font-size:0.8rem;font-weight:600;color:#374151;white-space:nowrap;border-right:1px solid #e5e7eb;">

            <th

              Sub-category</th>
            <th
              style="padding:12px;text-align:left;font-size:0.8rem;font-weight:600;color:#374151;min-width:250px;border-right:1px solid #e5e7eb;">
              Title</th>
            <th
              style="padding:12px;text-align:left;font-size:0.8rem;font-weight:600;color:#374151;white-space:nowrap;border-right:1px solid #e5e7eb;">

            <th

            <th

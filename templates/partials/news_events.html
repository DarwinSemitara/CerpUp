<style>
    .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .news-card {
        background: white;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .news-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .news-media {
        width: 100%;
        height: 200px;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .news-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .news-media iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .news-media-placeholder {
        font-size: 3rem;
        color: #d1d5db;
    }

    .news-content {
        padding: 16px;
    }

    .news-title {
        font-size: 1rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
        line-height: 1.4;
    }

    .news-description {
        font-size: 0.875rem;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 12px;
    }

    .news-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid #f3f4f6;
    }

    .news-date {
        font-size: 0.75rem;
        color: #9ca3af;
    }

    .news-actions {
        display: flex;
        gap: 8px;
    }

    .media-type-select {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
    }

    .media-type-btn {
        flex: 1;
        padding: 10px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        transition: all 0.15s;
        font-size: 0.875rem;
        font-weight: 600;
        color: #6b7280;
    }

    .media-type-btn.active {
        border-color: #6b0f1a;
        background: #fdf2f3;
        color: #6b0f1a;
    }

    .media-upload-area {
        border: 2px dashed #d1d5db;
        border-radius: 8px;
        padding: 32px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s;
        margin-bottom: 16px;
    }

    .media-upload-area:hover {
        border-color: #6b0f1a;
        background: #fdf2f3;
    }

    .media-preview {
        max-width: 100%;
        max-height: 200px;
        border-radius: 8px;
        margin-top: 12px;
        display: none;
    }

    .media-preview.show {
        display: block;
    }
</style>

<div style="padding: 32px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #111827; margin: 0;">News & Events Management</h2>
        <button class="btn-primary" onclick="openAddNewsModal()">
            <svg style="width:14px;height:14px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Add News/Event
        </button>
    </div>

    <div id="news-grid" class="news-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 32px;">
            <div class="content-spinner">
                <div class="spinner-ring"></div> Loading news...
            </div>
        </div>
    </div>
</div>

<!-- Add News Modal -->
<div class="modal" id="add-news-modal">
    <div class="modal-box" style="max-width: 600px;">
        <div class="modal-header">
            <h3 class="modal-title">Add News/Event</h3>
            <button class="modal-close" onclick="closeAddNewsModal()">✕</button>
        </div>
        <form id="add-news-form" onsubmit="submitAddNews(event)">
            <div class="modal-body">
                <!-- Title -->
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-input" required>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-input" rows="3" style="resize: vertical;"></textarea>
                </div>

                <!-- Media Type Selection -->
                <div class="form-group">
                    <label class="form-label">Media Type</label>
                    <div class="media-type-select">
                        <button type="button" class="media-type-btn active" onclick="selectMediaType('text')">
                            📝 Text Only
                        </button>
                        <button type="button" class="media-type-btn" onclick="selectMediaType('image')">
                            🖼️ Image
                        </button>
                        <button type="button" class="media-type-btn" onclick="selectMediaType('video')">
                            🎥 Video
                        </button>
                    </div>
                    <input type="hidden" name="media_type" id="media-type-input" value="text">
                </div>

                <!-- Image Upload Area -->
                <div class="form-group" id="image-upload-area" style="display: none;">
                    <label for="news-media-input" class="media-upload-area">
                        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            style="margin: 0 auto 12px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Click to upload image</p>
                        <img id="media-preview" class="media-preview" alt="Preview">
                    </label>
                    <input type="file" id="news-media-input" name="media" accept="image/*" style="display: none;"
                        onchange="previewMedia(event)">
                </div>

                <!-- Video URL Input -->
                <div class="form-group" id="video-url-area" style="display: none;">
                    <label class="form-label">Video URL (YouTube, Vimeo, etc.)</label>
                    <input type="url" name="video_url" id="video-url-input" class="form-input"
                        placeholder="https://www.youtube.com/watch?v=...">
                    <p style="font-size: 0.75rem; color: #6b7280; margin-top: 6px;">
                        Paste a YouTube or Vimeo video URL
                    </p>
                </div>

                <div class="form-error" id="add-news-error"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeAddNewsModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="add-news-submit-btn">Add News</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete News Modal -->
<div class="modal" id="delete-news-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title">Delete News/Event</h3>
            <button class="modal-close" onclick="closeDeleteNewsModal()">✕</button>
        </div>
        <div class="modal-body">
            <p style="font-size:0.875rem;color:#6b7280;">
                Are you sure you want to delete this news/event? This action cannot be undone.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeDeleteNewsModal()">Cancel</button>
            <button class="btn-danger" id="delete-news-btn" onclick="confirmDeleteNews()">Delete</button>
        </div>
    </div>
</div>

<script src="/static/js/news_events.js"></script>

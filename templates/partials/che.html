        const SAVE_DELAY = 1500; // ms debounce before auto-saving

        let currentConvId = null;   // UUID of active conversation
        let chatHistory = [];     // [{role, content, time}]
        let isLoading = false;
        let sidebarOpen = false;
        let saveTimer = null;
        let convList = [];     // cached sidebar list

        /* ════════════════════════════════════════

        ════════════════════════════════════════ */
        const wrapperEl = document.getElementById('che-wrapper');

        const sidebarEmpty = document.getElementById('che-sidebar-empty');
        const messagesEl = document.getElementById('che-messages');
        const inputEl = document.getElementById('che-input');
        const sendBtn = document.getElementById('che-send-btn');
        const suggestEl = document.getElementById('che-suggestions');
        const statusDot = document.getElementById('che-status-dot');
        const statusText = document.getElementById('che-status-text');
        const inputWrap = document.getElementById('che-input-wrap');
        const ctxToggle = document.getElementById('che-context-toggle');
        const avatarBtn = document.getElementById('che-avatar-btn');
        const convTitle = document.getElementById('che-conv-title');

        /* ════════════════════════════════════════
           INIT
        ════════════════════════════════════════ */
        (async function init() {
            inputEl.addEventListener('input', () => {
                sendBtn.disabled = inputEl.value.trim() === '' || isLoading;
            });

            avatarBtn.addEventListener('click', toggleSidebar);
            document.getElementById('che-new-btn').addEventListener('click', function () { cheNewConversation(); });

            // Load conversation list, then either resume last or start fresh
            await loadConversationList();

            if (convList.length > 0) {
                // Resume the most recently updated conversation
                await loadConversation(convList[0].id);
            } else {
                // No history — start a fresh unsaved session
                startFreshSession();
            }
        })();

        /* ════════════════════════════════════════
           SIDEBAR
        ════════════════════════════════════════ */
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            sidebarEl.classList.toggle('open', sidebarOpen);
            avatarBtn.classList.toggle('sidebar-open', sidebarOpen);
            if (sidebarOpen) loadConversationList();
        }

        async function loadConversationList() {
            try {
                const res = await fetch('/api/che/conversations');
                if (!res.ok) {
                    console.warn('CHE: Failed to load conversations, status:', res.status);
                    return;
                }
                const data = await res.json();
                convList = data.conversations || [];
                renderSidebarList();
            } catch (e) {
                console.warn('CHE: Could not load conversations:', e.message);
            }
        }

        function renderSidebarList() {
            sidebarList.innerHTML = '';
            if (convList.length === 0) {
                sidebarEmpty.style.display = 'flex';
                sidebarList.style.display = 'none';
                return;
            }
            sidebarEmpty.style.display = 'none';
            sidebarList.style.display = 'block';

            // Render all conversations (sorted by updated_at)
            convList.forEach(conv => {
                renderConversationItem(conv);
            });
        }

        function renderConversationItem(conv) {
            const item = document.createElement('div');
            item.className = 'che-conv-item' + (conv.id === currentConvId ? ' active' : '');
            item.dataset.id = conv.id;

            const dateStr = formatRelativeDate(conv.updated_at);

            item.innerHTML = `
            <div class="che-conv-item-body">
                <div class="che-conv-item-title">${escHtml(conv.title)}</div>
                <div class="che-conv-item-date">${dateStr}</div>
            </div>
            <button class="che-conv-delete" title="Delete conversation" data-id="${conv.id}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>`;

            // Click body → load conversation
            item.querySelector('.che-conv-item-body').addEventListener('click', () => {
                loadConversation(conv.id);
                if (window.innerWidth < 768) toggleSidebar();
            });

            // Click delete button
            const deleteButton = item.querySelector('.che-conv-delete');
            deleteButton.addEventListener('click', async (e) => {
                e.stopPropagation();
                await deleteConversation(conv.id);
            });

            sidebarList.appendChild(item);
        }

        /* ════════════════════════════════════════
           CONVERSATION MANAGEMENT
        ════════════════════════════════════════ */
        function startFreshSession() {
            currentConvId = null;
            chatHistory = [];
            messagesEl.innerHTML = '';
            suggestEl.style.display = 'flex';
            convTitle.textContent = 'CHE Assistant';
            setStatus('ready');
            appendMessage('ai', 'Hello! I\'m **CHE**, your CERP AI Assistant. I can help you with research projects, members, schedules, FSR reports, extension activities, and anything else related to the system. What can I do for you today?');
            // Mark sidebar items (none active)
            document.querySelectorAll('.che-conv-item').forEach(el => el.classList.remove('active'));
        }

        async function loadConversation(id) {
            try {
                // CRITICAL: Save current conversation before switching
                if (currentConvId && currentConvId !== id && chatHistory.length > 0) {
                    clearTimeout(saveTimer);
                    await saveConversation();
                }

                const res = await fetch(`/api/che/conversations/${id}`);
                if (!res.ok) return;
                const conv = await res.json();

                currentConvId = conv.id;
                chatHistory = (conv.messages || []).map(m => ({
                    role: m.role, content: m.content
                }));

                // Render messages
                messagesEl.innerHTML = '';
                suggestEl.style.display = chatHistory.length === 0 ? 'flex' : 'none';
                convTitle.textContent = conv.title || 'CHE Assistant';

                if (chatHistory.length === 0) {
                    appendMessage('ai', 'Hello! I\'m **CHE**, your CERP AI Assistant. What can I do for you?');
                } else {
                    (conv.messages || []).forEach(m => {
                        appendMessage(m.role === 'user' ? 'user' : 'ai', m.content, false, m.time, true);
                    });
                }

                // Update sidebar active state
                document.querySelectorAll('.che-conv-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.id === id);
                });

                setStatus('ready');
            } catch (e) {
                console.error('Load conversation error:', e);
            }
        }

        async function ensureConversation(firstMessage) {
            // If no active conversation, create one using the first user message as title
            if (!currentConvId) {
                const title = firstMessage.length > 45
                    ? firstMessage.slice(0, 45).trim() + '…'
                    : firstMessage;
                try {
                    const res = await fetch('/api/che/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title })
                    });
                    const conv = await res.json();
                    currentConvId = conv.id;

                    // CRITICAL: Reset chat history for the new conversation
                    // The welcome message should be the only thing in history
                    const welcomeMsg = messagesEl.querySelector('.che-msg-ai');
                    if (welcomeMsg) {
                        const welcomeText = welcomeMsg.querySelector('.che-msg-bubble').textContent;
                        chatHistory = [{
                            role: 'assistant',
                            content: welcomeText,
                            time: new Date().toISOString()
                        }];
                    } else {
                        chatHistory = [];
                    }

                    // Prepend to list & re-render
                    convList.unshift(conv);
                    if (convList.length > 7) convList.pop();
                    renderSidebarList();
                    convTitle.textContent = title;
                } catch (e) {
                    console.error('Create conversation error:', e);
                }
            }
        }

        function scheduleSave() {
            if (!currentConvId) return;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveConversation, SAVE_DELAY);
        }

        async function saveConversation() {
            if (!currentConvId || chatHistory.length === 0) return;
            try {
                // Attach timestamps from DOM if not already present
                const messages = chatHistory.map((m, i) => ({
                    role: m.role,
                    content: m.content,
                    time: m.time || new Date().toISOString()
                }));

                console.log(`💾 Saving conversation ${currentConvId} with ${messages.length} messages`);

                await fetch(`/api/che/conversations/${currentConvId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });
                // Update updated_at in local list
                const idx = convList.findIndex(c => c.id === currentConvId);
                if (idx > -1) {
                    convList[idx].updated_at = new Date().toISOString();
                    // Move to top
                    const [item] = convList.splice(idx, 1);
                    convList.unshift(item);
                    renderSidebarList();
                }
            } catch (e) {
                console.error('Save conversation error:', e);
            }
        }

        async function deleteConversation(id) {
            try {
                await fetch(`/api/che/conversations/${id}`, { method: 'DELETE' });
                convList = convList.filter(c => c.id !== id);
                renderSidebarList();
                // If we deleted the active one, start fresh
                if (id === currentConvId) {
                    if (convList.length > 0) {
                        await loadConversation(convList[0].id);
                    } else {
                        startFreshSession();
                    }
                }
            } catch (e) {
                console.error('Delete conversation error:', e);
            }
        }

        /* ════════════════════════════════════════
           PUBLIC HANDLERS
        ════════════════════════════════════════ */
        window.cheNewConversation = async function () {
            // Save current before switching
            if (currentConvId && chatHistory.length > 0) {
                clearTimeout(saveTimer);
                await saveConversation();
            }
            startFreshSession();
            if (!sidebarOpen) toggleSidebar();
        };

        window.handleCheKeydown = function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendCheMessage();
            }
        };

        window.autoResizeChe = function (el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        };

        window.sendSuggestion = function (btn) {
            if (isLoading) return;
            inputEl.value = btn.textContent.trim();
            sendBtn.disabled = false;
            suggestEl.style.display = 'none';
            sendCheMessage();
        };

        window.sendCheMessage = async function () {
            const text = inputEl.value.trim();
            if (!text || isLoading) return;

            // Intercept confirmation words if there's a pending action
            if (pendingCheAction) {
                const confirmWords = ['proceed', 'yes', 'confirm', 'go ahead', 'do it', 'ok', 'okay', 'sure', 'oo', 'sige'];
                const cancelWords = ['no', 'cancel', 'never mind', 'nevermind', 'stop', 'huwag'];
                const lower = text.toLowerCase();
                if (confirmWords.some(w => lower.includes(w))) {
                    inputEl.value = '';
                    appendMessage('user', text);
                    chatHistory.push({ role: 'user', content: text, time: new Date().toISOString() });
                    confirmCheAction();
                    return;
                }
                if (cancelWords.some(w => lower.includes(w))) {
                    inputEl.value = '';
                    appendMessage('user', text);
                    chatHistory.push({ role: 'user', content: text, time: new Date().toISOString() });
                    cancelCheAction();
                    return;
                }
            }

            suggestEl.style.display = 'none';

            // Create conversation on first message
            await ensureConversation(text);

            const now = new Date().toISOString();
            appendMessage('user', text);
            chatHistory.push({ role: 'user', content: text, time: now });

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            setLoading(true);

            const typingId = showTyping();

            try {
                const res = await fetch('/api/che/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory.slice(-MAX_HISTORY).map(m => ({ role: m.role, content: m.content })),
                        include_context: ctxToggle.checked,
                        conversation_id: currentConvId || ''
                    })
                });

                removeTyping(typingId);

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.reply || `Server error ${res.status}`);
                }

                const data = await res.json();
                const reply = data.reply || 'No response received.';
                const isErr = data.error === true;

                // Strip the JSON action block from displayed text
                const cleanReply = reply.replace(/```json\s*\{[\s\S]*?\}\s*```/g, '').trim();
                appendMessage('ai', cleanReply || reply, isErr);
                chatHistory.push({ role: 'assistant', content: cleanReply || reply, time: new Date().toISOString() });

                // Handle scheduling actions from CHE
                if (data.action && !isErr) {
                    if (data.action.confirm) {
                        // Show confirmation popup for destructive/additive actions
                        showCheActionConfirm(data.action, cleanReply);
                    } else if (data.action_result) {
                        // Non-confirm action (query) — show result inline
                        const arMsg = formatActionResult(data.action_result);
                        if (arMsg) {
                            appendMessage('ai', arMsg, false);
                            chatHistory.push({ role: 'assistant', content: arMsg, time: new Date().toISOString() });
                        }
                    }
                }

                // Auto-save after each AI reply
                scheduleSave();

            } catch (err) {
                removeTyping(typingId);
                appendMessage('ai', `⚠️ ${err.message || 'Could not reach CHE. Please try again.'}`, true);
            } finally {
                setLoading(false);
            }
        };

        /* ════════════════════════════════════════
           HELPERS
        ════════════════════════════════════════ */
        function setLoading(state) {
            isLoading = state;
            sendBtn.disabled = state || inputEl.value.trim() === '';
            inputWrap.classList.toggle('disabled', state);
            setStatus(state ? 'busy' : 'ready');
        }

        function setStatus(state) {
            statusDot.className = 'che-status-dot';
            if (state === 'busy') {
                statusDot.classList.add('busy');
                statusText.textContent = 'Thinking...';
            } else if (state === 'error') {
                statusDot.classList.add('error');
                statusText.textContent = 'Error';
            } else {
                statusText.textContent = 'Ready';
            }
        }

        function appendMessage(role, rawText, isError, isoTime, skipAnimation) {
            const timeStr = isoTime
                ? new Date(isoTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const html = (role === 'user') ? escHtml(rawText) : formatText(rawText);

            const msgEl = document.createElement('div');
            msgEl.className = 'che-msg' + (role === 'user' ? ' che-msg-user' : '');
            if (skipAnimation) msgEl.style.animation = 'none';

            if (role !== 'user') {
                msgEl.innerHTML = `
                <div class="che-msg-avatar">${aiIcon()}</div>
                <div class="che-msg-content">
                    <div class="che-msg-bubble${isError ? ' error-bubble' : ''}">${html}</div>
                    <div class="che-msg-time">${timeStr}</div>
                </div>`;
            } else {
                msgEl.innerHTML = `
                <div class="che-msg-content">
                    <div class="che-msg-bubble">${html}</div>
                    <div class="che-msg-time">${timeStr}</div>
                </div>
                <div class="che-msg-user-avatar">A</div>`;
            }

            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const el = document.createElement('div');
            el.className = 'che-msg';
            el.id = id;
            el.innerHTML = `<div class="che-msg-avatar">${aiIcon()}</div>
            <div class="che-typing-dots"><span></span><span></span><span></span></div>`;
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function formatText(text) {
            let t = escHtml(text);
            // Remove any leftover json action blocks from display
            t = t.replace(/```json[\s\S]*?```/g, '');
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            t = t.replace(/((?:^|\n)[•\-]\s+.+)+/g, block => {
                const items = block.trim().split('\n').map(
                    line => '<li>' + line.replace(/^[•\-]\s+/, '') + '</li>'
                );
                return '<ul>' + items.join('') + '</ul>';
            });
            t = t.replace(/\n/g, '<br>');
            return t;
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatRelativeDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function aiIcon() {
            return `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1 1 .03 2.798-1.442 2.798H4.24c-1.47 0-2.443-1.798-1.442-2.798L4.2 15.3"/>
        </svg>`;
        }

        /* ════════════════════════════════════════
           CHE SCHEDULING ACTION CONFIRMATION
        ════════════════════════════════════════ */
        let pendingCheAction = null;

        function showCheActionConfirm(action, contextMsg) {
            pendingCheAction = action;
            const actionType = action.action || 'unknown';
            const params = action.params || {};

            let title = 'Confirm Action';
            let details = '';

            if (actionType === 'add_schedule') {
                title = '📅 Add Schedule Block';
                details = `<strong>Subject:</strong> ${params.subjCode || 'TBA'}<br>
                    <strong>Professor:</strong> ${params.prof || 'TBA'}<br>
                    <strong>Day:</strong> ${params.day || 'Auto (GA optimized)'}<br>
                    <strong>Time:</strong> ${params.time || 'Auto (GA optimized)'}<br>
                    <strong>Room:</strong> ${params.room || 'TBA'}<br>
                    <strong>Section:</strong> ${params.section || 'TBA'}`;
            } else if (actionType === 'move_schedule') {
                title = '🔄 Move Schedule Block';
                details = `<strong>Professor:</strong> ${params.prof || 'Any'}<br>
                    <strong>Subject:</strong> ${params.subjCode || 'Any'}<br>
                    <strong>Move to:</strong> ${params.target_day || 'Optimal'} ${params.target_time_period || ''}`;
            } else if (actionType === 'delete_schedule') {
                title = '🗑️ Delete Schedule Block';
                details = `<strong>Professor:</strong> ${params.prof || 'Any'}<br>
                    <strong>Subject:</strong> ${params.subjCode || 'Any'}<br>
                    <strong>Day:</strong> ${params.day || 'Any'}`;
            } else if (actionType === 'generate_full') {
                title = '⚡ Generate Full Schedule (GA)';
                details = 'This will run the Genetic Algorithm to generate an optimized schedule.';
            }

            // Build and show modal
            let modal = document.getElementById('che-action-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'che-action-modal';
                modal.className = 'che-action-modal-overlay';
                document.body.appendChild(modal);
            }
            modal.innerHTML = `
                <div class="che-action-modal">
                    <div class="che-action-modal-header">${title}</div>
                    <div class="che-action-modal-body">${details}</div>
                    <div class="che-action-modal-footer">
                        <button class="che-action-btn che-action-btn-cancel" onclick="cancelCheAction()">Cancel</button>
                        <button class="che-action-btn che-action-btn-confirm" onclick="confirmCheAction()">Confirm & Execute</button>
                    </div>
                </div>`;
            modal.style.display = 'flex';
        }

        window.cancelCheAction = function () {
            pendingCheAction = null;
            const modal = document.getElementById('che-action-modal');
            if (modal) modal.style.display = 'none';
            appendMessage('ai', '❌ Action cancelled.', false);
            chatHistory.push({ role: 'assistant', content: 'Action cancelled by user.', time: new Date().toISOString() });
            scheduleSave();
        };

        window.confirmCheAction = async function () {
            if (!pendingCheAction) return;
            const modal = document.getElementById('che-action-modal');
            if (modal) modal.style.display = 'none';

            const action = pendingCheAction;
            pendingCheAction = null;

            appendMessage('ai', '⏳ Executing action...', false);

            try {
                const res = await fetch('/api/che/execute-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                const result = await res.json();

                if (result.success) {
                    const msg = `✅ ${result.message || 'Action completed successfully.'}`;
                    appendMessage('ai', msg, false);
                    chatHistory.push({ role: 'assistant', content: msg, time: new Date().toISOString() });

                    // Refresh schedule page if loaded
                    if (typeof loadSchedules === 'function') {
                        loadSchedules();
                    } else if (window.loadSchedules) {
                        window.loadSchedules();
                    }
                } else {
                    const msg = `⚠️ ${result.message || 'Action failed.'}`;
                    appendMessage('ai', msg, true);
                    chatHistory.push({ role: 'assistant', content: msg, time: new Date().toISOString() });
                }
            } catch (err) {
                appendMessage('ai', `⚠️ Failed to execute: ${err.message}`, true);
            }
            scheduleSave();
        };

        function formatActionResult(result) {
            if (!result) return '';
            if (result.data && result.data.conflicts && result.data.conflicts.length > 0) {
                let msg = `⚠️ **${result.data.total} conflict(s) found:**\n`;
                result.data.conflicts.slice(0, 5).forEach(c => {
                    msg += `• ${c.type} conflict: ${c.professor || c.room || c.section} — ${c.schedule1.subjCode} vs ${c.schedule2.subjCode} on ${c.schedule1.day}\n`;
                });
                return msg;
            }
            if (result.data && result.data.schedules) {
                let msg = `📋 **${result.message}**\n`;
                result.data.schedules.slice(0, 10).forEach(s => {
                    msg += `• ${s.subjCode} | ${s.prof} | ${s.day} ${s.start}-${s.end} | ${s.room}\n`;
                });
                return msg;
            }
            return result.message || '';
        }
    })();
</script>
